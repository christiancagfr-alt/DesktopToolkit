# Build Windows + macOS on GitHub-hosted runners and attach to the tag Release.
# Triggers: push tag v*  |  manual workflow_dispatch with tag input
name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *) echo "Tag must look like vX.Y.Z, got: $TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release $TAG ($VERSION)"

  build-windows:
    needs: resolve
    runs-on: windows-latest
    steps:
      # Checkout the commit/branch that triggered the workflow (main for manual, tag tip for tag push)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm DesktopToolkit.spec
          if (-not (Test-Path "dist\DesktopToolkit\DesktopToolkit.exe")) {
            throw "Build failed: dist\DesktopToolkit\DesktopToolkit.exe missing"
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          $releaseDir = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $zipName = "DesktopToolkit-$version-windows-portable.zip"
          $zipPath = Join-Path $releaseDir $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "dist\DesktopToolkit\*" -DestinationPath $zipPath -Force
          Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath |
            ForEach-Object { $_.Hash.ToLowerInvariant() } |
            Set-Content -Path (Join-Path $releaseDir "DesktopToolkit-$version-windows-portable.zip.sha256") -Encoding ascii -NoNewline

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup ISCC.exe not found after install"
          }

      - name: Build Windows Setup installer
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          $iss = Join-Path $PWD "installer\DesktopToolkit.iss"
          (Get-Content $iss -Raw) -replace '#define MyAppVersion "[\d.]+"', "#define MyAppVersion `"$version`"" |
            Set-Content $iss -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $iss
          $setup = Join-Path $PWD "dist\release\DesktopToolkit-$version-windows-setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup exe missing: $setup" }
          $releaseDir = Join-Path $PWD "release-assets"
          Copy-Item $setup (Join-Path $releaseDir (Split-Path $setup -Leaf)) -Force
          Get-FileHash -Algorithm SHA256 -LiteralPath $setup |
            ForEach-Object { $_.Hash.ToLowerInvariant() } |
            Set-Content -Path (Join-Path $releaseDir "DesktopToolkit-$version-windows-setup.exe.sha256") -Encoding ascii -NoNewline
          Get-ChildItem $releaseDir | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    needs: resolve
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (PortAudio for sounddevice)
        run: |
          brew install portaudio || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyttsx3

      - name: Build macOS .app
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          chmod +x build_macos.sh build_mac.sh 2>/dev/null || true
          if [[ -f build_macos.sh ]]; then
            ./build_macos.sh
          else
            ./build_mac.sh
          fi
          mkdir -p release-assets
          ZIP="dist/release/DesktopToolkit-${VERSION}-macos.zip"
          DMG="dist/release/DesktopToolkit-${VERSION}-macos.dmg"
          if [[ ! -f "$ZIP" ]]; then
            echo "Looking for app bundle…"
            find dist -maxdepth 3 -name "*.app" -type d || true
            APP=""
            if [[ -d dist/DesktopToolkit.app ]]; then
              APP="dist/DesktopToolkit.app"
            elif [[ -d dist/DesktopToolkit/DesktopToolkit.app ]]; then
              APP="dist/DesktopToolkit/DesktopToolkit.app"
            fi
            if [[ -z "$APP" ]]; then
              echo "ERROR: .app not found"
              ls -laR dist || true
              exit 1
            fi
            mkdir -p dist/release
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
            shasum -a 256 "$ZIP" | awk '{print $1}' > "${ZIP}.sha256"
          fi
          cp -f "$ZIP" "release-assets/"
          cp -f "${ZIP}.sha256" "release-assets/" 2>/dev/null || \
            shasum -a 256 "release-assets/DesktopToolkit-${VERSION}-macos.zip" | awk '{print $1}' > \
              "release-assets/DesktopToolkit-${VERSION}-macos.zip.sha256"
          if [[ -f "$DMG" ]]; then
            cp -f "$DMG" "release-assets/"
            cp -f "${DMG}.sha256" "release-assets/" 2>/dev/null || \
              shasum -a 256 "release-assets/DesktopToolkit-${VERSION}-macos.dmg" | awk '{print $1}' > \
                "release-assets/DesktopToolkit-${VERSION}-macos.dmg.sha256"
          else
            echo "WARNING: DMG not found (zip still published)"
          fi
          ls -la release-assets

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 portaudio19-dev \
            libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 \
            fuse zip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux portable zip
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          chmod +x build_linux.sh
          ./build_linux.sh
          mkdir -p release-assets
          ZIP="dist/release/DesktopToolkit-${VERSION}-linux-x86_64.zip"
          test -f "$ZIP"
          cp -f "$ZIP" release-assets/
          cp -f "${ZIP}.sha256" release-assets/ 2>/dev/null || \
            sha256sum "release-assets/DesktopToolkit-${VERSION}-linux-x86_64.zip" | awk '{print $1}' > \
              "release-assets/DesktopToolkit-${VERSION}-linux-x86_64.zip.sha256"
          ls -la release-assets

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: [resolve, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -la artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Desktop Toolkit ${{ needs.resolve.outputs.version }}
          body_path: installer/RELEASE_NOTES_v${{ needs.resolve.outputs.version }}.md
          files: artifacts/*
          make_latest: true
          fail_on_unmatched_files: true
