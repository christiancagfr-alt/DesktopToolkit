# Build Windows + macOS on GitHub-hosted runners and attach to the tag Release.
# Triggers: push tag v*  |  manual workflow_dispatch with tag input
name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        env:
          # Pass via env (not shell interpolation) to avoid script injection from tag input
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          # Strict semver tag only — rejects shell metacharacters
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)?$ ]]; then
            echo "Tag must look like vX.Y.Z, got: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release $TAG ($VERSION)"

  build-windows:
    needs: resolve
    runs-on: windows-latest
    steps:
      # Checkout the commit/branch that triggered the workflow (main for manual, tag tip for tag push)
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Python
        # actions/setup-python@v5.4.0
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-build.lock

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm DesktopToolkit.spec
          if (-not (Test-Path "dist\DesktopToolkit\DesktopToolkit.exe")) {
            throw "Build failed: dist\DesktopToolkit\DesktopToolkit.exe missing"
          }

      - name: Stage MSVC runtime DLLs next to exe
        shell: pwsh
        run: |
          # Windows loads MSVCP140.dll from the app directory / _internal before System32.
          # PyQt ships copies under PyQt6\Qt6\bin, which is NOT on that search path — so
          # machines without the VC++ redistributable still fail with "找不到 MSVCP140.dll".
          $root = Join-Path $PWD "dist\DesktopToolkit"
          $internal = Join-Path $root "_internal"
          $qtBin = Join-Path $internal "PyQt6\Qt6\bin"
          $names = @("MSVCP140.dll", "MSVCP140_1.dll", "MSVCP140_2.dll", "VCRUNTIME140.dll", "VCRUNTIME140_1.dll", "CONCRT140.dll")
          foreach ($name in $names) {
            $src = Join-Path $qtBin $name
            if (-not (Test-Path $src)) {
              $sys = Join-Path $env:SystemRoot "System32\$name"
              if (Test-Path $sys) { $src = $sys } else { Write-Host "skip missing $name"; continue }
            }
            Copy-Item $src (Join-Path $root $name) -Force
            Copy-Item $src (Join-Path $internal $name) -Force
            Write-Host "staged $name from $src"
          }
          if (-not (Test-Path (Join-Path $root "MSVCP140.dll"))) {
            throw "Failed to stage MSVCP140.dll next to DesktopToolkit.exe"
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          $releaseDir = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $zipName = "DesktopToolkit-$version-windows-portable.zip"
          $zipPath = Join-Path $releaseDir $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "dist\DesktopToolkit\*" -DestinationPath $zipPath -Force
          Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath |
            ForEach-Object { $_.Hash.ToLowerInvariant() } |
            Set-Content -Path (Join-Path $releaseDir "DesktopToolkit-$version-windows-portable.zip.sha256") -Encoding ascii -NoNewline

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup ISCC.exe not found after install"
          }

      - name: Download VC++ redistributable (MSVCP140)
        shell: pwsh
        run: |
          $out = Join-Path $PWD "installer\vc_redist.x64.exe"
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          if (-not (Test-Path $out)) { throw "vc_redist.x64.exe download failed" }
          $len = (Get-Item $out).Length
          if ($len -lt 1000000) { throw "vc_redist.x64.exe too small: $len bytes" }
          $signature = Get-AuthenticodeSignature -LiteralPath $out
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
            throw "vc_redist.x64.exe has no valid Microsoft Authenticode signature"
          }
          Write-Host "Saved $out ($len bytes)"
          # Also ship beside portable zip for machines that skip the Setup
          $releaseDir = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item $out (Join-Path $releaseDir "vc_redist.x64.exe") -Force
          $bat = Join-Path $releaseDir "install-VC-redist-fix-MSVCP140.bat"
          $batLines = @(
            '@echo off',
            'echo Installing Microsoft Visual C++ 2015-2022 x64 runtime...',
            'echo Fixes: MSVCP140.dll was not found / DesktopToolkit cannot start.',
            '"%~dp0vc_redist.x64.exe" /install /passive /norestart',
            'if errorlevel 1 (',
            '  echo Install failed. Try running vc_redist.x64.exe as Administrator.',
            '  pause',
            '  exit /b 1',
            ')',
            'echo Done. You can start DesktopToolkit.exe now.',
            'pause'
          )
          Set-Content -Path $bat -Value $batLines -Encoding ASCII

      - name: Build Windows Setup installer
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          $iss = Join-Path $PWD "installer\DesktopToolkit.iss"
          if (-not (Test-Path (Join-Path $PWD "installer\vc_redist.x64.exe"))) {
            throw "installer\vc_redist.x64.exe missing — download step failed"
          }
          (Get-Content $iss -Raw) -replace '#define MyAppVersion "[\d.]+"', "#define MyAppVersion `"$version`"" |
            Set-Content $iss -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $iss
          $setup = Join-Path $PWD "dist\release\DesktopToolkit-$version-windows-setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup exe missing: $setup" }
          $releaseDir = Join-Path $PWD "release-assets"
          Copy-Item $setup (Join-Path $releaseDir (Split-Path $setup -Leaf)) -Force
          Get-FileHash -Algorithm SHA256 -LiteralPath $setup |
            ForEach-Object { $_.Hash.ToLowerInvariant() } |
            Set-Content -Path (Join-Path $releaseDir "DesktopToolkit-$version-windows-setup.exe.sha256") -Encoding ascii -NoNewline
          Get-ChildItem $releaseDir | Format-Table Name, Length

      - name: Upload Windows artifacts
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-assets
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    needs: resolve
    # Prefer latest macOS image (better runner availability than pinned macos-14)
    runs-on: macos-latest
    # Do not block the whole release if macOS runners are unavailable/cancelled
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install system deps (PortAudio for sounddevice)
        run: |
          brew install portaudio || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-build.lock

      - name: Build macOS .app
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          chmod +x build_macos.sh build_mac.sh 2>/dev/null || true
          if [[ -f build_macos.sh ]]; then
            ./build_macos.sh
          else
            ./build_mac.sh
          fi
          mkdir -p release-assets
          ZIP="dist/release/DesktopToolkit-${VERSION}-macos.zip"
          DMG="dist/release/DesktopToolkit-${VERSION}-macos.dmg"
          if [[ ! -f "$ZIP" ]]; then
            echo "Looking for app bundle…"
            find dist -maxdepth 3 -name "*.app" -type d || true
            APP=""
            if [[ -d dist/DesktopToolkit.app ]]; then
              APP="dist/DesktopToolkit.app"
            elif [[ -d dist/DesktopToolkit/DesktopToolkit.app ]]; then
              APP="dist/DesktopToolkit/DesktopToolkit.app"
            fi
            if [[ -z "$APP" ]]; then
              echo "ERROR: .app not found"
              ls -laR dist || true
              exit 1
            fi
            mkdir -p dist/release
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
            shasum -a 256 "$ZIP" | awk '{print $1}' > "${ZIP}.sha256"
          fi
          cp -f "$ZIP" "release-assets/"
          cp -f "${ZIP}.sha256" "release-assets/" 2>/dev/null || \
            shasum -a 256 "release-assets/DesktopToolkit-${VERSION}-macos.zip" | awk '{print $1}' > \
              "release-assets/DesktopToolkit-${VERSION}-macos.zip.sha256"
          if [[ -f "$DMG" ]]; then
            cp -f "$DMG" "release-assets/"
            cp -f "${DMG}.sha256" "release-assets/" 2>/dev/null || \
              shasum -a 256 "release-assets/DesktopToolkit-${VERSION}-macos.dmg" | awk '{print $1}' > \
                "release-assets/DesktopToolkit-${VERSION}-macos.dmg.sha256"
          else
            echo "WARNING: DMG not found (zip still published)"
          fi
          ls -la release-assets

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-assets
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 portaudio19-dev \
            libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 \
            fuse zip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-build.lock

      - name: Build Linux portable zip
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          chmod +x build_linux.sh
          ./build_linux.sh
          mkdir -p release-assets
          ZIP="dist/release/DesktopToolkit-${VERSION}-linux-x86_64.zip"
          test -f "$ZIP"
          cp -f "$ZIP" release-assets/
          cp -f "${ZIP}.sha256" release-assets/ 2>/dev/null || \
            sha256sum "release-assets/DesktopToolkit-${VERSION}-linux-x86_64.zip" | awk '{print $1}' > \
              "release-assets/DesktopToolkit-${VERSION}-linux-x86_64.zip.sha256"
          ls -la release-assets

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-assets
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: [resolve, build-windows, build-macos, build-linux]
    # Publish whatever platforms succeeded (macOS may be skipped when runners unavailable)
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      (
        needs.build-windows.result == 'success' ||
        needs.build-linux.result == 'success' ||
        needs.build-macos.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout notes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Download all artifacts
        # actions/download-artifact@v4.2.1
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          path: artifacts
          merge-multiple: true
        continue-on-error: true

      - name: List assets
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ls -la artifacts || true
          count=$(find artifacts -type f | wc -l | tr -d ' ')
          echo "asset file count=$count"
          if [ "$count" -lt 1 ]; then
            echo "No build artifacts to publish"
            exit 1
          fi

      - name: Create / update GitHub Release
        # softprops/action-gh-release@v2.2.1
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Desktop Toolkit ${{ needs.resolve.outputs.version }}
          body_path: installer/RELEASE_NOTES_v${{ needs.resolve.outputs.version }}.md
          files: artifacts/*
          make_latest: true
          fail_on_unmatched_files: false
